# 评分规则：书上评价表的功能项。每项单独启动一次程序，按步骤操作，核对结果。
# 格式说明见 server/src/grading/checks.ts
- title: 环境值能正确推送到 LED 屏
  steps:
    - select: { control: com_adamPort, item: COM2 }
    - select: { control: com_ledPort, item: COM5 }
    - click: btn_open
    - click: btn_get
    - expect: { control: txt_temperature, text: '25' }
    - expect: { led: '25', desc: 显示温度 25 }
    - expect: { led: '60', desc: 显示湿度 60 }
    - expect: { led: '500', desc: 显示光照度 500 }

- title: 能推送最新的环境信息
  steps:
    - select: { control: com_adamPort, item: COM2 }
    - select: { control: com_ledPort, item: COM5 }
    - click: btn_open
    - click: btn_get
    - board: { temperature: 31 }
    - click: btn_get
    - expect: { led: '31', desc: 显示最新的温度 31 }
