# 评分规则：书上评价表的功能项。每项单独启动一次程序，按步骤操作，核对结果。
# 格式说明见 server/src/grading/checks.ts
- title: 能手动开关路灯
  steps:
    - select: { control: com_lamp, item: COM4 }
    - select: { control: com_environment, item: COM3 }
    - click: btn_open
    - click: btn_lampOpen
    - expect: { zigbee: 1, on: true }
    - click: btn_lampClose
    - expect: { zigbee: 1, on: false }

- title: 能实时联动路灯（有人亮灯，没人关灯）
  steps:
    - select: { control: com_lamp, item: COM4 }
    - select: { control: com_environment, item: COM3 }
    - click: btn_open
    - click: ch_bodyInfrared
    - expect: { control: btn_lampOpen, enabled: false, desc: 勾选人体开关后"开"按钮不可用 }
    - board: { bodyInfrared: true }
    - expect: { zigbee: 1, on: true, within: 6s, desc: 有人经过时打开 }
    - board: { bodyInfrared: false }
    - expect: { zigbee: 1, on: false, within: 6s, desc: 人离开后关闭 }
