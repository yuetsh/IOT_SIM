# 评分规则：书上评价表的功能项。每项单独启动一次程序，按步骤操作，核对结果。
# 格式说明见 server/src/grading/checks.ts
- title: 增加用户后能用新账号登录
  steps:
    - click: btnAdd
    - text: { control: txtNewUser1, value: zhangsan }
    - text: { control: txtPass1, value: "123" }
    - text: { control: txtPass2, value: "123" }
    - click: btnOk
    - text: { control: txtUserName, value: zhangsan }
    - text: { control: txtPassword, value: "123" }
    - click: btnOk
    - expect: { messageBox: 登录成功 }

- title: 用户名或密码不对时提示错误
  steps:
    - text: { control: txtUserName, value: nobody }
    - text: { control: txtPassword, value: wrong }
    - click: btnOk
    - expect: { messageBox: 无效的密码或用户名 }

- title: 两次输入的密码不一致时不能增加用户
  steps:
    - click: btnAdd
    - text: { control: txtNewUser1, value: lisi }
    - text: { control: txtPass1, value: "123" }
    - text: { control: txtPass2, value: "456" }
    - click: btnOk
    - expect: { messageBox: 用户名或密码错误 }
