# 评分规则：书上评价表的功能项。每项单独启动一次程序（使用 database.sql 建的初始数据库），按步骤操作，核对结果。
# 初始数据有 3 行：2024-01-16 09:00、2024-01-18 14:30、2024-01-23 08:15
# 格式说明见 server/src/grading/checks.ts
- title: 能实现按日期查询灾情数据
  steps:
    - pick: { control: StartTime, value: '2024-01-15' }
    - pick: { control: EndTime, value: '2024-01-20' }
    - click: btnCx
    - expect: { control: dataGridView1, row: [编号=1], desc: 查到 1 月 16 日的数据 }
    - expect: { control: dataGridView1, row: [编号=2], desc: 查到 1 月 18 日的数据 }
    - expect: { control: dataGridView1, noRow: [编号=3], desc: 不包含时间段以外（1 月 23 日）的数据 }
    - pick: { control: StartTime, value: '2024-01-21' }
    - pick: { control: EndTime, value: '2024-01-31' }
    - click: btnCx
    - expect: { control: dataGridView1, row: [编号=3], desc: 改变日期后重新查询，查到 1 月 23 日的数据 }
    - expect: { control: dataGridView1, noRow: [编号=1], desc: 改变日期后重新查询，不再包含 1 月 16 日的数据 }
