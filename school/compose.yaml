# 机房的 IOT：只有网页 + 反代，后端和数据库在服务器上（见 Caddyfile、README.md）
services:
  iot-web:
    image: caddy:alpine
    container_name: iot-web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - ./build:/usr/share/caddy:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - '86:80'
